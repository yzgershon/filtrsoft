<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <script>
      // Apply the saved appearance before the stylesheet paints, including on
      // sign-in and offline launches. Corrupt or blocked storage keeps dark mode.
      (() => {
        let theme = 'dark';
        try { const saved = JSON.parse(localStorage.getItem('filtrsoft:settings') || '{}').theme;
          if (saved === 'light' || saved === 'dark') theme = saved;
          if (saved === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f5f6f8' : '#0d1017';
      })();
    </script>
    <title>Filtrsoft — what a used tech listing is really worth</title>
    <meta name="description" content="Paste a listing. Find out what it's actually worth and what's wrong with it, before you drive." />
    <link rel="preconnect" href="https://images.craigslist.org" />

    <!-- PWA. Chrome offers INSTALL only with a manifest AND a service worker
         with a fetch handler, over HTTPS. Without both it downgrades to "Add
         shortcut", which is what Filtrsoft was doing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Filtrsoft" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered after load so it never competes with first paint.
      if ("serviceWorker" in navigator) {
        addEventListener("load", () =>
          navigator.serviceWorker.register("/sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
