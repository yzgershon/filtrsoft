name: Backend and deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FILTRSOFT_DB: /tmp/filtrsoft-ci.db
      FILTRSOFT_PHOTOS: /tmp/filtrsoft-ci-photos
      FILTRSOFT_VISION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: docker build --target verification --tag filtrsoft-verification .
      - run: docker run --rm --network none filtrsoft-verification
      - run: docker build --tag filtrsoft-ci .
